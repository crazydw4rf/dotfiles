command = "i3status-rs"

# Colors
background = "#282828ff"
color = "#ffffffff"
separator = "#9a8a62ff"
tag_fg = "#d79921ff"
tag_bg = "#282828ff"
tag_focused_fg = "#1d2021ff"
tag_focused_bg = "#689d68ff"
tag_urgent_fg = "#282828ff"
tag_urgent_bg = "#cc241dff"
tag_inactive_fg = "#d79921ff"
tag_inactive_bg = "#282828ff"

# The font and various sizes
font = "ZedMono NF Medium 10"
height = 24
margin_top = 0
margin_bottom = 0
margin_left = 0
margin_right = 0
separator_width = 2.0
tags_r = 0.0
tags_padding = 25.0
tags_margin = 0.0
blocks_r = 0.0
blocks_overlap = 0.0
show_tray = true
tray_icon_size = 16           # optional, defaults to bar height - 4 when omitted
tray_spacing = 4.0
tray_padding = 2.0

# Misc
position = "bottom"              # either "top" or "bottom"
layer = "top"                    # one of "top", "overlay", "bottom" or "background"
hide_inactive_tags = true
invert_touchpad_scrolling = true
show_tags = true
show_layout_name = true
blend = true                     # whether tags/blocks colors should blend with bar's background
show_mode = true

[output.eDP-1]
enable = true
